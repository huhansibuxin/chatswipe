name: Build chatswipe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        run: |
          # 手动 git clone，绕过 actions/checkout 在 GitHub 限流(codeload 429/502/503)时下载失败的问题
          git clone --depth 1 --branch main https://github.com/huhansibuxin/chatswipe.git .

      - name: Setup Theos
        run: |
          git clone --recurse-submodules https://github.com/theos/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV

      - name: Install dependencies
        run: brew install dpkg ldid

      - name: Install SDK
        run: |
          cd ${{ runner.temp }}/theos/sdks
          # git sparse-checkout 只拉 iPhoneOS16.5.sdk 目录（走 git 协议，绕过 codeload archive 限流导致 master.zip 反复坏包）
          for i in 1 2 3; do
            rm -rf sdkrepo
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdkrepo && break
            echo "sdk clone retry $i"; sleep 10
          done
          cd sdkrepo
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk ../
          cd ..
          rm -rf sdkrepo

      - name: Build
        run: |
          set -o pipefail
          make package 2>&1 | tee build.log

      - name: Fix dependency install name in staged dylib (-> @executable_path, 与 wctweak 一致)
        # TrollFools 把 dylib 放进 app 的 @executable_path/Frameworks/，故把对
        # CydiaSubstrate 的依赖改写为该路径，运行时 loader 才能找到 ellekit。
        run: |
          set -o pipefail
          {
            DYLIB=$(find .theos/_ -name 'chatswipe.dylib' | head -1)
            if [ -z "$DYLIB" ]; then echo "ERROR: staged dylib not found"; find .theos -name '*.dylib' | head; exit 1; fi
            CUR=$(otool -L "$DYLIB" | grep -i 'CydiaSubstrate.framework/CydiaSubstrate' | awk '{print $1}' | head -1)
            echo "staged dylib: $DYLIB"
            echo "current CydiaSubstrate dep: $CUR"
            echo "before:"; otool -L "$DYLIB" | grep -i cydiasubstrate || true
            if [ -n "$CUR" ]; then
              install_name_tool -change "$CUR" @executable_path/Frameworks/CydiaSubstrate.framework/CydiaSubstrate "$DYLIB"
            else
              echo "WARN: dylib 中未发现 CydiaSubstrate 依赖！"
            fi
            ldid -S "$DYLIB"
            echo "after:"; otool -L "$DYLIB" | grep -i cydiasubstrate || true
            rm -f packages/*.deb
            dpkg-deb -b .theos/_ "packages/chatswipe.deb"
            echo "=== deb contents ==="; dpkg-deb -c packages/chatswipe.deb
          } 2>&1 | tee -a build.log

      - name: Upload build log (always, for diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chatswipe-rootless
          path: packages/*.deb
